<div class="auth">
  <div class="panel">
    <h1>Forgot your password?</h1>
    <p class="muted intro">Enter the email you signed up with. We will send a 6-digit code to reset your password.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
        @if (email.invalid && email.touched) {
          <span class="field-error">Enter a valid email address, like name@example.com.</span>
        }
      </div>

      @if (error()) {
        <div class="alert alert-error" role="alert">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary full" [disabled]="submitting()">
        {{ submitting() ? 'Sending...' : 'Send code' }}
      </button>
    </form>

    <p class="switch muted"><a routerLink="/login">Back to sign in</a></p>
  </div>
</div>
