server:
  port: 8082

spring:
  config:
       import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/order_db
    username: root
    password: YourPasswordHere
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

product:
  service:
    url: http://localhost:8081