server:
  port: 8081
  
spring:
  config:
       import: optional:classpath:application-local.yml
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/product_db
    username: root
    password: YourPasswordHere
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  cors:
    allowed-origin: http://localhost:4200
  jwt:
    secret: SET_IN_LOCAL_FILE
  internal:
    api-key: SET_IN_LOCAL_FILE        
